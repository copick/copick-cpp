name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Automates versioning + changelog from Conventional Commits. On merge of the release PR
# it tags a release; GitHub attaches the source archives automatically. No compiled binary
# is published — copick-cpp is built from source (see the README), since a prebuilt library
# is only usable alongside the exact tensorstore/reflect-cpp versions it was linked against.
jobs:
  release-please:
    name: release PR / release
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
