name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Automates versioning + changelog from Conventional Commits. On merge of the release PR
# it tags a release; GitHub attaches the *source* archives automatically.
jobs:
  release-please:
    name: release PR / release
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
